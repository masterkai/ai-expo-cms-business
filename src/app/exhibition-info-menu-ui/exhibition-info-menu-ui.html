<div class="w-[880px] flex gap-[16px]">
    <!--    <div class="w-full flex flex-col gap-1">-->
    <!--       <label for="Future_Stage_Agenda">贊助權益</label> -->

    <!--    </div>-->
    <div class="w-full flex flex-col justify-start items-start gap-3 p-4 rounded-md bg-white shadow-sm">
        <div class="w-full flex flex-col gap-1">
            <label for="unsureLectureAgenda">不知講座議程</label>
            <p-multiselect
                    (ngModelChange)="MainStore.setSelectedExhibitionRights({
                    lecture: $event
                    })"
                    [ngModel]="MainStore.selected_exhibition_right().lecture"
                    [options]="MainStore.exhibition_rights().lecture"
                    fluid
                    id="unsureLectureAgenda"
                    optionLabel="option"
                    placeholder="請選擇"></p-multiselect>
        </div>
        <div class="w-full flex flex-col gap-1">
            <label for="Future_Stage_Agenda">未來講座議程</label>

            <p-multiselect
                    (ngModelChange)="MainStore.setSelectedExhibitionRights({
                    stage: $event
                    })"
                    [ngModel]="MainStore.selected_exhibition_right().stage"
                    [options]="MainStore.exhibition_rights().stage"
                    fluid
                    id="Future_Stage_Agenda"
                    optionLabel="option"
                    placeholder="請選擇"></p-multiselect>
        </div>

    </div>
    <div class="w-full flex flex-col justify-start items-start gap-3 p-4 rounded-md bg-white shadow-sm">

        <div class="w-full flex flex-col gap-1">
            <label for="Media_promotion_dropdown_menu">媒體廣宣</label>

            <p-multiselect
                    (ngModelChange)="MainStore.setSelectedExhibitionRights({
                    promotion: $event
                    })"
                    [maxSelectedLabels]="3"
                    [ngModel]="MainStore.selected_exhibition_right().promotion"
                    [options]="MainStore.exhibition_rights().promotion"
                    fluid
                    id="Media_promotion_dropdown_menu"
                    optionLabel="option"
                    placeholder="請選擇"></p-multiselect>
        </div>
        <div class="w-full flex flex-col gap-1">
            <label for="Add_to_cart_dropdown_menu">加購項目</label>

            <p-multiselect
                    (ngModelChange)="MainStore.setSelectedExhibitionRights({
                    optional: $event
                    })"
                    [maxSelectedLabels]="3"
                    [ngModel]="MainStore.selected_exhibition_right().optional"
                    [options]="MainStore.exhibition_rights().optional"
                    fluid
                    id="Add_to_cart_dropdown_menu"
                    optionLabel="option"
                    placeholder="請選擇"></p-multiselect>
        </div>
        <div class="w-full flex flex-col gap-1">
            <label for="selected_Exhibition_booth">展場攤位</label>
            <p-multiselect
                    (ngModelChange)="MainStore.setSelectedExhibitionRights({
                    booth: $event
                    })"
                    [ngModel]="MainStore.selected_exhibition_right().booth"
                    [options]="MainStore.exhibition_rights().booth"
                    fluid
                    id="selected_Exhibition_booth"
                    optionLabel="option"
                    placeholder="請選擇"></p-multiselect>
        </div>
    </div>
</div>
