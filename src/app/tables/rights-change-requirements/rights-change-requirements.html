<p-table
        [paginator]="true"
        [rowsPerPageOptions]="[5, 10, 20]"
        [rows]="5"
        [tableStyle]="{ 'min-width': '50rem' }"
        [value]="rightsChangeRequirements()"
>
    <ng-template #header>
        <tr>
            <th style="width:20%">申請時間</th>
            <th style="width:20%">公司名稱</th>
            <th style="width:20%">統編</th>
            <th style="width:20%">項目</th>
            <th style="width:20%">
                <div class="w-full flex justify-center">異動</div>
            </th>

        </tr>
    </ng-template>
    <ng-template #body let-item>
        <tr>
            <td>{{ item.application_time | date: 'yyyy/MM/dd HH:mm:ss' }}</td>
            <td>{{ item.company_name }}</td>
            <td>{{ item.unino }}</td>
            <td>{{ item.item_name }}</td>
            <td>
                <div
                        class="w-full flex justify-center"
                >
                    <p-button (click)="handleViewDetails(item)" label="異動" severity="info" variant="text"/>
                </div>
            </td>
        </tr>
    </ng-template>
</p-table>
