<p-table
        [paginator]="true"
        [rowsPerPageOptions]="[5, 10, 20]"
        [rows]="5"
        [tableStyle]="{ 'min-width': '50rem' }"
        [value]="documentUpdatesPendingReview()"
>
    <!--    id: string;-->
    <!--    application_time: string;-->
    <!--    company_name: string;-->
    <!--    unino: string;-->
    <!--    column_name: string;-->
    <!--    old_value: string;-->
    <!--    new_value: string;-->
    <ng-template #header>
        <tr>
            <th style="width:15%">申請時間</th>
            <th style="width:15%">公司名稱</th>
            <th style="width:15%">統編</th>
            <th style="width:15%">欄位</th>
            <th style="width:15%">舊值</th>
            <th style="width:15%">新值</th>
            <th style="width:10%">
                <div class="w-full flex justify-center">審核</div>
            </th>

        </tr>
    </ng-template>
    <ng-template #body let-item>
        <tr>
            <td>{{ item.application_time | date: 'yyyy/MM/dd HH:mm:ss' }}</td>
            <td>{{ item.company_name }}</td>
            <td>{{ item.unino }}</td>
            <td>{{ item.column_name }}</td>
            <td>{{ item.old_value }}</td>
            <td>{{ item.new_value }}</td>
            <td>
                <div
                        class="w-full flex justify-center"
                >
                    <p-button (click)="handleChange(item)" label="審核" severity="info" variant="text"/>
                </div>
            </td>
        </tr>
    </ng-template>
</p-table>
