<p-table
        [paginator]="true"
        [rowsPerPageOptions]="[5, 10, 20]"
        [rows]="5"
        [tableStyle]="{ 'min-width': '50rem' }"
        [value]="companyDataReviewStore.visibleItems()"
>
    <!--    id: string;-->
    <!--    application_time: string;-->
    <!--    company_name: string;-->
    <!--    unino: string;-->
    <!--    column_name: string;-->
    <!--    old_value: string;-->
    <!--    new_value: string;-->
    <ng-template #header>
        <tr>
            <th style="width:15%">申請時間</th>
            <th style="width:15%">公司名稱</th>
            <th style="width:15%">統編</th>
            <th style="width:10%">
                <div class="w-full flex justify-center">ACTION</div>
            </th>

        </tr>
    </ng-template>
    <ng-template #body let-item>
        <tr>
            <td>{{ item.createdate }}</td>
            <td>{{ item.company_name }}</td>
            <td>{{ item.unified_business_no }}</td>
            <td>
                <div
                        class="w-full flex justify-center"
                >
                    <p-button (onClick)="handleChange(item)" label="審核" severity="info" variant="text"/>
                </div>
            </td>
        </tr>
    </ng-template>
</p-table>

<app-common-dialog
        [header]="''"
        [needTopSpace]="true"
        [visible]="companyDataReviewStore.isDialog_dataReview_Visible()"
        [width]="'90%'">

    <app-review-ui/>
</app-common-dialog>
