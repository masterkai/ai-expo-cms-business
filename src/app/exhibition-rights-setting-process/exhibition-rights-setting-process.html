<p-stepper [value]="1" class="basis-[50rem]">
    <p-step-list>
        <p-step [value]="1">參展權益設定</p-step>
        <p-step [value]="2">專屬連結預覽列表</p-step>
    </p-step-list>
    <p-step-panels>
        <p-step-panel [value]="1">
            <ng-template #content let-activateCallback="activateCallback">
                <div class="flex flex-col h-full">
                    <div
                            class="border-2 border-dashed border-surface-200 dark:border-surface-700 rounded bg-surface-50 dark:bg-surface-950 flex-auto flex justify-center items-start font-medium p-4 h-[50vh] overflow-auto"
                    >
                        <app-exhibition-info-menu-ui/>
                    </div>
                </div>
                <div class="flex pt-6 justify-end">
                    <p-button (onClick)="activateCallback(2)" icon="pi pi-arrow-right" iconPos="right"
                              label="前往下一步(專屬連結預覽列表)"/>
                </div>
            </ng-template>
        </p-step-panel>

        <p-step-panel [value]="2">
            <ng-template #content let-activateCallback="activateCallback">
                <div class="flex flex-col h-full">
                    <div
                            class="border-2 border-dashed border-surface-200 dark:border-surface-700 rounded bg-surface-50 dark:bg-surface-950 flex-auto flex justify-center items-center font-medium p-4 h-[50vh]"
                    >
                        <app-exhibition-info-preview-ui/>
                    </div>
                </div>
                <div class="flex pt-6 justify-between">
                    <p-button (onClick)="activateCallback(1)" icon="pi pi-arrow-left" iconPos="right"
                              label="回參展權益設定"/>
                    <p-button

                            (onClick)="confirm()"
                            fluid
                            label="確認"
                    >
                    </p-button>
                </div>
            </ng-template>
        </p-step-panel>
    </p-step-panels>
</p-stepper>
